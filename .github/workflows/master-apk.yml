name: IAC33 Master APK

on:
  workflow_dispatch:
  push:
    branches: [iac33-functional-upgrade-20260918]
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  master-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Require release signing configuration
        env:
          KEYSTORE_B64: ${{ secrets.IAC33_ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.IAC33_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.IAC33_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.IAC33_ANDROID_KEY_PASSWORD }}
        run: |
          set -eu
          test -n "$KEYSTORE_B64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/iac33-release.keystore"
          test -s "$RUNNER_TEMP/iac33-release.keystore"
          keytool -list -keystore "$RUNNER_TEMP/iac33-release.keystore" -storepass "$KEYSTORE_PASSWORD" >/dev/null
          echo "Release signing configuration verified."

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/iac33-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.IAC33_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.IAC33_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.IAC33_ANDROID_KEY_PASSWORD }}
        run: |
          set -eu
          gradle assembleRelease --no-daemon --stacktrace --console=plain \
            -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Verify APK exists
        run: |
          set -eu
          test -s app/build/outputs/apk/release/app-release.apk
          ls -lh app/build/outputs/apk/release/app-release.apk

      - name: Upload Master APK
        uses: actions/upload-artifact@v7
        with:
          name: iac33-master-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
