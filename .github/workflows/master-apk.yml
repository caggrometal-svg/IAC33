name: IAC33 Master APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iac33-master-apk
  cancel-in-progress: true

jobs:
  build-master:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Build master validation APK
        run: |
          set -euo pipefail
          gradle assembleDebug --no-daemon --stacktrace --console=plain
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Publish master validation APK
        uses: actions/upload-artifact@v7
        with:
          name: IAC33-master-validation
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
