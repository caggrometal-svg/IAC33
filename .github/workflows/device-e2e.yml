name: IAC33 Device Control E2E

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: device-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: iac33
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d iac33"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/iac33
      CONTROL_TOKEN: ci-control-token
      DEVICE_PAIRING_TOKEN: ci-pairing-token
      PORT: 8787
      E2E_BASE_URL: http://127.0.0.1:8787
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install backend
        working-directory: backend
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Initialize database
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/schema.sql
      - name: Start backend
        run: |
          node backend/src/start.js > /tmp/iac33-backend.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent "$E2E_BASE_URL/ready" > /tmp/ready.json; then
              cat /tmp/ready.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/iac33-backend.log
          exit 1
      - name: Run device control E2E
        run: node backend/test/e2e-device-control.mjs
      - name: Live Render smoke test
        run: |
          set -e
          for i in $(seq 1 60); do
            if curl --fail --silent --show-error https://iac33-backend.onrender.com/health > /tmp/render-health.json; then
              cat /tmp/render-health.json
              break
            fi
            sleep 2
          done
          test -s /tmp/render-health.json
          for i in $(seq 1 60); do
            if curl --fail --silent --show-error https://iac33-backend.onrender.com/ready > /tmp/render-ready.json; then
              cat /tmp/render-ready.json
              exit 0
            fi
            sleep 2
          done
          echo "Render readiness did not recover within 120s"
          exit 1
      - name: Backend logs on failure
        if: failure()
        run: cat /tmp/iac33-backend.log
