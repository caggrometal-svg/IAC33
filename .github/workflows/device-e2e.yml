name: IAC33 Device Control E2E

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: device-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run device control E2E
        env:
          E2E_BASE_URL: ${{ secrets.IAC33_E2E_BASE_URL }}
          DEVICE_PAIRING_TOKEN: ${{ secrets.IAC33_DEVICE_PAIRING_TOKEN }}
          CONTROL_TOKEN: ${{ secrets.IAC33_CONTROL_TOKEN }}
          DATABASE_URL: ${{ secrets.IAC33_DATABASE_URL }}
        run: |
          test -n "$E2E_BASE_URL"
          test -n "$DEVICE_PAIRING_TOKEN"
          test -n "$CONTROL_TOKEN"
          test -n "$DATABASE_URL"
          cd backend
          npm install --ignore-scripts --no-audit --no-fund
          node test/e2e-device-control.mjs
