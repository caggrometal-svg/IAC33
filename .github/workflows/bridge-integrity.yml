name: IAC33 Bridge Integrity

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iac33-bridge-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bridge-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Verify GPT bridge contract
        run: |
          set -eu
          python3 - <<'PY'
          from pathlib import Path

          oidc = Path("backend/src/github-oidc.js").read_text()
          ota = Path(".github/workflows/ota-release.yml").read_text()

          required_oidc = [
              "repo:caggrometal-svg@322356974/IAC33@1372305375:ref:refs/heads/main",
              "ota-release.yml@refs/heads/main",
              "IAC33 OTA Release",
          ]
          required_ota = [
              "id-token: write",
              "/v1/gpt/commands",
              "IAC33_OTA_BOOTSTRAP_VERSION",
              "IAC33_VERSION_CODE",
              "IAC33_VERSION_NAME",
              "iac33-bridge-ecdsa-v1",
          ]

          missing = [item for item in required_oidc if item not in oidc]
          missing += [item for item in required_ota if item not in ota]

          app_dir = Path("app")
          if not app_dir.is_dir():
              missing.append("app/ directory")
          elif not any(app_dir.rglob("*")):
              missing.append("app/ source tree")

          if missing:
              raise SystemExit("Bridge integrity contract missing: " + ", ".join(missing))
          print("Bridge contract: PASS")
          PY

      - name: Verify Render bridge
        run: |
          set -eu
          curl --fail --silent --show-error https://iac33-backend.onrender.com/health | grep -Fq '"ok":true'
          curl --fail --silent --show-error https://iac33-backend.onrender.com/ready | grep -Fq '"ok":true'

      - name: Verify backend syntax
        working-directory: backend
        run: node --check src/server.js && node --check src/github-oidc.js && node --check src/gpt-command-bridge.js
