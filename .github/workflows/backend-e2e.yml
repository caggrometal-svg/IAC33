name: IAC33 Backend E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: iac33-backend-e2e.yml-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: iac33
          POSTGRES_PASSWORD: iac33
          POSTGRES_DB: iac33
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U iac33 -d iac33"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install backend dependencies
        working-directory: backend
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Apply database schema
        env:
          PGPASSWORD: iac33
        run: psql "postgresql://iac33@127.0.0.1:5432/iac33" -f backend/schema.sql
      - name: Start backend
        env:
          PORT: 3000
          DATABASE_URL: postgresql://iac33:iac33@127.0.0.1:5432/iac33
          CONTROL_TOKEN: iac33-e2e-control
          DEVICE_PAIRING_TOKEN: iac33-e2e-pairing
        run: |
          node backend/src/start.js > /tmp/iac33-backend.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/health | grep -q '\"ok\":true'; then exit 0; fi
            sleep 1
          done
          cat /tmp/iac33-backend.log
          exit 1
      - name: Run device control E2E
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
          DEVICE_PAIRING_TOKEN: iac33-e2e-pairing
          CONTROL_TOKEN: iac33-e2e-control
          DATABASE_URL: postgresql://iac33:iac33@127.0.0.1:5432/iac33
        run: node backend/test/e2e-device-control.mjs
      - name: Run GPT bridge E2E
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
          CONTROL_TOKEN: iac33-e2e-control
          DATABASE_URL: postgresql://iac33:iac33@127.0.0.1:5432/iac33
        run: node backend/test/e2e-gpt-bridge.mjs
      - name: External production AI smoke
        run: |
          set -euo pipefail
          response=$(curl -fsS --max-time 20 -X POST https://iac33-backend.onrender.com/v1/ai/generate -H 'content-type: application/json' --data-raw '{"messages":[{"role":"user","content":"Responde exactamente: IAC33-PRUEBA-OK"}],"timeoutMs":12000}')
          echo "$response"
          node -e 'const r=JSON.parse(process.argv[1]); if(r.ok!==true || !r.text || !r.provider || !r.model) process.exit(1); console.log(JSON.stringify({ok:r.ok,text:r.text,provider:r.provider,model:r.model}))' "$response"
      - name: Backend log on failure
        if: failure()
        run: cat /tmp/iac33-backend.log
