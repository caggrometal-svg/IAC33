name: IAC33 Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: iac33-android-ci.yml-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'backend/package.json'
      - name: Install backend dependencies
        working-directory: backend
        run: npm install --ignore-scripts
      - name: Backend tests
        working-directory: backend
        run: npm test
      - name: Unit tests and build
        run: gradle testDebugUnitTest assembleDebug --parallel --build-cache --no-daemon --console=plain
      - name: Android Connected E2E
        timeout-minutes: 25
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          cores: 4
          ram-size: 4096M
          heap-size: 768M
          disk-size: 8192M
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -no-metrics
          disable-animations: true
          script: bash scripts/android-connected-e2e.sh

      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: iac33-android-test-reports
          path: |
            app/build/reports/androidTests/connected/**
            app/build/outputs/androidTest-results/connected/**
          if-no-files-found: warn
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: iac33-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
