name: iac33-live-ai-smoketest

on:
  push:
    paths:
      - ".github/workflows/iac33-live-ai-smoketest.yml"

jobs:
  live-ai:
    runs-on: ubuntu-latest
    steps:
      - name: POST IAC33 AI endpoint
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -sS --max-time 25 -X POST https://iac33-backend.onrender.com/v1/ai/generate             -H 'content-type: application/json'             --data '{"messages":[{"role":"user","content":"Responde exactamente: IAC33-PRUEBA-OK"}],"timeoutMs":12000}')"
          echo "$response"
          python - <<'PY' "$response"
          import json, sys
          data = json.loads(sys.argv[1])
          if not data.get("ok"):
              raise SystemExit(f"AI_TEST_FAILED: {data}")
          if not data.get("text") or not data.get("provider") or not data.get("model"):
              raise SystemExit(f"AI_TEST_INCOMPLETE: {data}")
          print("IAC33_LIVE_AI_TEST_OK")
          print("provider=" + str(data["provider"]))
          print("model=" + str(data["model"]))
          print("text=" + str(data["text"]))
          PY
