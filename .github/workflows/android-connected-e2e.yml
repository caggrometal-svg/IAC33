name: IAC33 Android Connected E2E

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: iac33-android-connected-e2e.yml-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-connected:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Run Android unit tests and build
        run: gradle testDebugUnitTest assembleDebug --parallel --build-cache --no-daemon --console=plain

      - name: Run Android connected E2E
        timeout-minutes: 25
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          cores: 4
          ram-size: 4096M
          heap-size: 768M
          disk-size: 8192M
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -no-metrics
          disable-animations: true
          script: bash scripts/android-connected-e2e.sh

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: iac33-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 7

      - name: Upload connected test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: iac33-connected-test-report
          path: app/build/reports/androidTests/connected/**
          if-no-files-found: warn
          retention-days: 7
