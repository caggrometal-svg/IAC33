name: IAC33 OTA Release

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/ota-release.yml'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: iac33-ota-release
  cancel-in-progress: true

jobs:
  ota-release:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Resolve Bridge ECDSA trust anchor
        env:
          BRIDGE_KEY_B64: ${{ secrets.BRIDGE_ECDSA_PRIVATE_KEY_B64 }}
          KEY_PASSWORD: ${{ secrets.IAC33_ANDROID_KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.IAC33_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -eu
          test -n "$BRIDGE_KEY_B64"
          test -n "$KEY_PASSWORD"
          test -n "$KEYSTORE_PASSWORD"
          RAW="$RUNNER_TEMP/bridge-key-bootstrap.raw"
          PEM="$RUNNER_TEMP/bridge-key-bootstrap.pem"
          PUB="$RUNNER_TEMP/bridge-key-bootstrap.pub.der"

          printf '%s' "$BRIDGE_KEY_B64" | base64 --decode > "$RAW"
          rm -f "$PEM" "$PUB"

          if openssl pkey -in "$RAW" -out "$PEM" 2>/dev/null; then
            :
          elif openssl pkey -inform DER -in "$RAW" -out "$PEM" 2>/dev/null; then
            :
          elif openssl ec -inform DER -in "$RAW" -out "$PEM" 2>/dev/null; then
            :
          elif openssl pkcs8 -inform DER -in "$RAW" -nocrypt -out "$PEM" 2>/dev/null; then
            :
          else
            for PASS in "$KEY_PASSWORD" "$KEYSTORE_PASSWORD" ""; do
              rm -f "$PEM"
              if openssl pkcs12 -in "$RAW" -nocerts -nodes -passin pass:"$PASS" -out "$PEM" 2>/dev/null; then
                break
              fi
            done
          fi

          test -s "$PEM"
          CURVE="$(openssl pkey -in "$PEM" -text -noout 2>/dev/null | grep -E 'ASN1 OID:|NIST CURVE:' | tail -n1 || true)"
          case "$CURVE" in
            *prime256v1*|*"P-256"*) ;;
            *) echo "Bridge signing key is not EC P-256" >&2; exit 1 ;;
          esac

          openssl pkey -in "$PEM" -pubout -outform DER -out "$PUB"
          OTA_PUBLIC_KEY_B64="$(base64 -w0 "$PUB")"
          CURRENT_PUBLIC="$(sed -n 's/^IAC33_OTA_PUBLIC_KEY_B64=//p' gradle.properties | head -n1)"
          BOOTSTRAP_VERSION="$(sed -n 's/^IAC33_OTA_BOOTSTRAP_VERSION=//p' gradle.properties | head -n1)"
          OTA_BOOTSTRAP=0
          if [ -z "$BOOTSTRAP_VERSION" ]; then OTA_BOOTSTRAP=1; fi
          if [ "$CURRENT_PUBLIC" != "$OTA_PUBLIC_KEY_B64" ]; then
            OTA_BOOTSTRAP=1
          fi

          if [ "$CURRENT_PUBLIC" != "$OTA_PUBLIC_KEY_B64" ]; then
            OTA_BOOTSTRAP=1
            if grep -q '^IAC33_OTA_PUBLIC_KEY_B64=' gradle.properties; then
              sed -i "s#^IAC33_OTA_PUBLIC_KEY_B64=.*#IAC33_OTA_PUBLIC_KEY_B64=$OTA_PUBLIC_KEY_B64#" gradle.properties
            else
              printf '\nIAC33_OTA_PUBLIC_KEY_B64=%s\n' "$OTA_PUBLIC_KEY_B64" >> gradle.properties
            fi
            git config user.name "iac33-ota[bot]"
            git config user.email "iac33-ota[bot]@users.noreply.github.com"
            git add gradle.properties
            git commit -m "chore(ota): align trust anchor with active Bridge signer"
            git push
            echo "BOOTSTRAP_REQUIRED=1"
          fi

          echo "OTA_PUBLIC_KEY_B64=$OTA_PUBLIC_KEY_B64" >> "$GITHUB_ENV"
          echo "BRIDGE_PEM_PATH=$PEM" >> "$GITHUB_ENV"
          echo "OTA_BOOTSTRAP=$OTA_BOOTSTRAP" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/iac33-release.keystore
          KEYSTORE_B64: ${{ secrets.IAC33_ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.IAC33_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.IAC33_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.IAC33_ANDROID_KEY_PASSWORD }}
        run: |
          set -eu
          test -n "$KEYSTORE_B64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" >/dev/null
          OTA_PUBLIC_KEY_B64="$(sed -n 's/^IAC33_OTA_PUBLIC_KEY_B64=//p' gradle.properties | head -n1)"
          test -n "$OTA_PUBLIC_KEY_B64"
          BASE_VERSION="2.0.0"
          test -n "$BASE_VERSION"
          IFS=. read -r VMAJOR VMINOR VPATCH VEXTRA <<< "$BASE_VERSION"
          VMAJOR="${VMAJOR:-0}"; VMINOR="${VMINOR:-0}"; VPATCH="${VPATCH:-0}"
          BASE_VERSION_CODE="$(sed -n 's/.*versionCode = providers.gradleProperty("IAC33_VERSION_CODE").orElse("\([0-9]*\)").get().toInt()/\1/p' app/build.gradle.kts | head -n1)"
          if [ -z "$BASE_VERSION_CODE" ]; then BASE_VERSION_CODE="$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts | head -n1)"; fi
          test -n "$BASE_VERSION_CODE"
          OTA_VERSION_CODE="$((BASE_VERSION_CODE + GITHUB_RUN_NUMBER))"
          OTA_VERSION_NAME="$VMAJOR.$VMINOR.$VPATCH.$GITHUB_RUN_NUMBER"
          BOOTSTRAP_VERSION="$(sed -n 's/^IAC33_OTA_BOOTSTRAP_VERSION=//p' gradle.properties | head -n1)"
          if [ "$OTA_BOOTSTRAP" = "1" ] && [ -z "$BOOTSTRAP_VERSION" ]; then
            printf '\nIAC33_OTA_BOOTSTRAP_VERSION=%s\n' "$OTA_VERSION_NAME" >> gradle.properties
            git config user.name "iac33-ota[bot]"
            git config user.email "iac33-ota[bot]@users.noreply.github.com"
            git add gradle.properties
            git commit -m "chore(ota): record bootstrap version"
            git push
            BOOTSTRAP_VERSION="$OTA_VERSION_NAME"
          fi
          test -n "$OTA_VERSION_NAME"
          test -n "$OTA_VERSION_CODE"
          echo "IAC33_VERSION_NAME=$OTA_VERSION_NAME" >> "$GITHUB_ENV"
          echo "OTA_VERSION_NAME=$OTA_VERSION_NAME" >> "$GITHUB_ENV"
          echo "IAC33_VERSION_CODE=$OTA_VERSION_CODE" >> "$GITHUB_ENV"
          echo "IAC33_OTA_BOOTSTRAP_VERSION=$BOOTSTRAP_VERSION" >> "$GITHUB_ENV"
          printf '%s' "$OTA_PUBLIC_KEY_B64" | base64 --decode > "$RUNNER_TEMP/iac33-ota-public-key.der"
          openssl pkey -pubin -inform DER -in "$RUNNER_TEMP/iac33-ota-public-key.der" -text -noout >/dev/null
          gradle assembleRelease --no-daemon --stacktrace --console=plain \
            -PIAC33_VERSION_NAME="$OTA_VERSION_NAME" \
            -PIAC33_VERSION_CODE="$OTA_VERSION_CODE" \
            -PIAC33_OTA_PUBLIC_KEY_B64="$OTA_PUBLIC_KEY_B64" \
            -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          test -s app/build/outputs/apk/release/app-release.apk

      - name: Normalize and sign OTA artifact
        env:
          BRIDGE_KEY_B64: ${{ secrets.BRIDGE_ECDSA_PRIVATE_KEY_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.IAC33_ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.IAC33_ANDROID_KEY_PASSWORD }}
        run: |
          set -eu
          test -n "$BRIDGE_KEY_B64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_PASSWORD"

          RAW="$RUNNER_TEMP/bridge-key.raw"
          PEM="$RUNNER_TEMP/bridge-key.pem"
          P12="$RUNNER_TEMP/bridge-key-export.p12"
          PUB="$RUNNER_TEMP/bridge-key-pub.der"
          EXPECTED_PUB="$RUNNER_TEMP/iac33-ota-public-key.der"
          EXPORT_PASSWORD="$KEY_PASSWORD"

          printf '%s' "$BRIDGE_KEY_B64" | base64 --decode > "$RAW"
          echo "Bridge key container: $(file -b "$RAW")"
          rm -f "$PEM" "$P12" "$PUB"

          if [ "$(file -b "$RAW")" = "Java KeyStore" ]; then
            FOUND=0
            for STORE_PASS in "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" changeit; do
              LIST="$RUNNER_TEMP/bridge-key-list.txt"
              if ! keytool -list -keystore "$RAW" -storetype JKS -storepass "$STORE_PASS" > "$LIST" 2>/dev/null; then
                continue
              fi

              while IFS= read -r ALIAS; do
                [ -n "$ALIAS" ] || continue

                for SRC_KEY_PASS in "$KEY_PASSWORD" "$KEYSTORE_PASSWORD" changeit; do
                  rm -f "$P12" "$PEM" "$PUB"

                  if ! keytool -importkeystore -noprompt \
                    -srckeystore "$RAW" -srcstoretype JKS \
                    -srcstorepass "$STORE_PASS" -srcalias "$ALIAS" -srckeypass "$SRC_KEY_PASS" \
                    -destkeystore "$P12" -deststoretype PKCS12 \
                    -deststorepass "$EXPORT_PASSWORD" -destkeypass "$EXPORT_PASSWORD" \
                    >/dev/null 2>&1; then
                    continue
                  fi

                  if ! openssl pkcs12 -in "$P12" -nocerts -nodes \
                    -passin pass:"$EXPORT_PASSWORD" -out "$PEM" >/dev/null 2>&1; then
                    continue
                  fi

                  if ! openssl pkey -in "$PEM" -pubout -outform DER -out "$PUB" >/dev/null 2>&1; then
                    continue
                  fi

                  KEY_CURVE="$(openssl pkey -in "$PEM" -text -noout 2>/dev/null | grep -E 'ASN1 OID:|NIST CURVE:' | tail -n1 || true)"
                  case "$KEY_CURVE" in
                    *prime256v1*|*"P-256"*) ;;
                    *) continue ;;
                  esac

                  if cmp -s "$PUB" "$EXPECTED_PUB"; then
                    FOUND=1
                    echo "Recovered expected OTA ECDSA P-256 key from JKS alias: $ALIAS"
                    break
                  fi
                done

                [ "$FOUND" -eq 1 ] && break
              done < <(awk -F, '/PrivateKeyEntry/ {gsub(/^ +| +$/, "", $1); print $1}' "$LIST")

              [ "$FOUND" -eq 1 ] && break
            done

            if [ "$FOUND" -ne 1 ]; then
              echo "JKS does not contain an EC P-256 private key matching IAC33_OTA_PUBLIC_KEY_B64" >&2
              echo "BRIDGE_ECDSA_PRIVATE_KEY_B64 must contain the dedicated OTA ECDSA key or a JKS containing that exact P-256 key." >&2
              exit 1
            fi
          else
            if openssl pkey -in "$RAW" -out "$PEM" 2>/dev/null; then
              :
            elif openssl pkey -inform DER -in "$RAW" -out "$PEM" 2>/dev/null; then
              :
            elif openssl ec -inform DER -in "$RAW" -out "$PEM" 2>/dev/null; then
              :
            elif openssl pkcs8 -inform DER -in "$RAW" -nocrypt -out "$PEM" 2>/dev/null; then
              :
            else
              FOUND=0
              for PASS in "$KEY_PASSWORD" "$KEYSTORE_PASSWORD" ""; do
                rm -f "$PEM"
                if openssl pkcs12 -in "$RAW" -nocerts -nodes -passin pass:"$PASS" -out "$PEM" 2>/dev/null; then
                  FOUND=1
                  break
                fi
              done
              [ "$FOUND" -eq 1 ] || { echo "Unable to normalize Bridge ECDSA private key" >&2; exit 1; }
            fi
          fi

          test -s "$PEM"
          openssl pkey -in "$PEM" -text -noout >/dev/null

          KEY_CURVE="$(openssl pkey -in "$PEM" -text -noout 2>/dev/null | grep -E 'ASN1 OID:|NIST CURVE:' | tail -n1 || true)"
          case "$KEY_CURVE" in
            *prime256v1*|*"P-256"*) ;;
            *) echo "Bridge signing key is not EC P-256" >&2; exit 1 ;;
          esac

          openssl pkey -in "$PEM" -pubout -outform DER -out "$PUB" >/dev/null
          cmp -s "$PUB" "$EXPECTED_PUB" || {
            echo "Bridge public key does not match the APK OTA trust anchor" >&2
            exit 1
          }

          openssl dgst -sha256 -sign "$PEM" app/build/outputs/apk/release/app-release.apk > "$RUNNER_TEMP/ota-signature.bin"
          base64 -w0 "$RUNNER_TEMP/ota-signature.bin" > "$RUNNER_TEMP/ota-signature.b64"
          sha256sum app/build/outputs/apk/release/app-release.apk | cut -d' ' -f1 > "$RUNNER_TEMP/ota-sha256"
          stat -c '%s' app/build/outputs/apk/release/app-release.apk > "$RUNNER_TEMP/ota-size"

      - name: Publish APK workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: IAC33-APK-${{ env.IAC33_VERSION_NAME }}-${{ github.run_number }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub release and manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "${IAC33_VERSION_NAME:-}"
          VERSION_NAME="${IAC33_VERSION_NAME}"
          TAG="ota-${VERSION_NAME}-${GITHUB_RUN_NUMBER}"
          ARTIFACT_NAME="iac33-${TAG}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$ARTIFACT_NAME"
          ROLLBACK_REF="$(gh release list --limit 20 --json tagName --order desc | jq -r --arg current "$TAG" 'map(select(.tagName != $current))[0].tagName // "none"')"
          ARTIFACT_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$ARTIFACT_NAME"
          CREATED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          SHA256="$(cat "$RUNNER_TEMP/ota-sha256")"
          SIZE="$(cat "$RUNNER_TEMP/ota-size")"
          SIGNATURE="$(cat "$RUNNER_TEMP/ota-signature.b64")"
          jq -n --arg releaseId "$TAG" --arg appVersion "$VERSION_NAME" --arg createdAt "$CREATED_AT" --arg artifactRef "$ARTIFACT_URL" --arg sha "$SHA256" --argjson size "$SIZE" --arg signature "$SIGNATURE" --arg rollbackRef "$ROLLBACK_REF" '{schemaVersion:1,releaseId:$releaseId,appVersion:$appVersion,createdAt:$createdAt,minimumSupportedVersion:"0.1.0",artifactRef:$artifactRef,artifactSha256:$sha,artifactSize:$size,algorithm:"SHA256withECDSA",signatureBase64:$signature,keyId:"iac33-bridge-ecdsa-v1",rollbackRef:$rollbackRef}' > manifest.json
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ARTIFACT_NAME" manifest.json --clobber
          else
            gh release create "$TAG" "$ARTIFACT_NAME" manifest.json --target "$(git rev-parse HEAD)" --title "IAC33 OTA $VERSION_NAME" --notes "Signed OTA release for IAC33 commit $(git rev-parse HEAD)."
          fi
          RELEASE_TARGET="$(git rev-parse HEAD)"
          if gh release view "$TAG" --json tagName,url,name >/dev/null 2>&1; then
            gh release view "$TAG" --json tagName,url,name
          else
            echo "Release $TAG was not created" >&2
            exit 1
          fi


      - name: Queue OTA command to IAC33 backend
        env:
          BACKEND_URL: https://iac33-backend.onrender.com
          OIDC_AUDIENCE: iac33-backend
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          test -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN"
          OIDC_TOKEN="$(curl --fail-with-body --silent --show-error             -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$OIDC_AUDIENCE" | jq -er '.value')"
          test -n "$OIDC_TOKEN"
          if [ -n "$IAC33_OTA_BOOTSTRAP_VERSION" ]; then
            BOOTSTRAP_STATUS="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $OIDC_TOKEN" \
              "$BACKEND_URL/v1/gpt/ota/bootstrap-status?requiredVersion=$IAC33_OTA_BOOTSTRAP_VERSION" | jq -er '.confirmed')"
            if [ "$BOOTSTRAP_STATUS" != "true" ]; then
              echo "OTA bootstrap not yet confirmed on an installed device."
              exit 0
            fi
          fi
          VERSION_NAME="${IAC33_VERSION_NAME:?IAC33_VERSION_NAME is not set}"
          TAG="ota-$VERSION_NAME-$GITHUB_RUN_NUMBER"
          ARTIFACT_NAME="iac33-$TAG.apk"
          ARTIFACT_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$ARTIFACT_NAME"
          CREATED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ROLLBACK_REF="$(gh release list --limit 20 --json tagName --order desc | jq -r --arg current "$TAG" 'map(select(.tagName != $current))[0].tagName // "none"')"
          EXPIRES_AT="$(date -u -d '+24 hours' +%Y-%m-%dT%H:%M:%SZ)"
          SHA256="$(cat "$RUNNER_TEMP/ota-sha256")"
          SIZE="$(cat "$RUNNER_TEMP/ota-size")"
          SIGNATURE="$(cat "$RUNNER_TEMP/ota-signature.b64")"
          COMMAND_ID="ota-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          IDEMPOTENCY="ota-$GITHUB_SHA"
          IDEMPOTENCY="${IDEMPOTENCY:0:40}"
          jq -n             --arg id "$COMMAND_ID"             --arg type "OTA_INSTALL"             --arg idempotencyKey "$IDEMPOTENCY"             --arg expiresAt "$EXPIRES_AT"             --arg releaseId "$TAG"             --arg appVersion "$VERSION_NAME"             --arg createdAt "$CREATED_AT"             --arg artifactRef "$ARTIFACT_URL"             --arg sha "$SHA256"             --argjson size "$SIZE"             --arg signature "$SIGNATURE"             --arg rollbackRef "$ROLLBACK_REF"             '{
              id:$id,
              type:$type,
              idempotencyKey:$idempotencyKey,
              expiresAt:$expiresAt,
              payload:{
                manifest:{
                  schemaVersion:1,
                  releaseId:$releaseId,
                  appVersion:$appVersion,
                  createdAt:$createdAt,
                  minimumSupportedVersion:"0.1.0",
                  artifactRef:$artifactRef,
                  artifactSha256:$sha,
                  artifactSize:$size,
                  algorithm:"SHA256withECDSA",
                  signatureBase64:$signature,
                  keyId:"iac33-bridge-ecdsa-v1",
                  rollbackRef:$rollbackRef
                }
              }
            }' > ota-command.json
          curl --fail-with-body --silent --show-error             -H "Authorization: Bearer $OIDC_TOKEN"             -H "Content-Type: application/json"             --data-binary @ota-command.json             "$BACKEND_URL/v1/gpt/commands"