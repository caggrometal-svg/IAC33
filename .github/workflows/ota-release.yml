name: IAC33 OTA Release

on:
  push:
    paths:
      - 'app/**'
      - '.github/workflows/ota-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ota-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/iac33-release.keystore
          KEYSTORE_B64: ${{ secrets.IAC33_ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.IAC33_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.IAC33_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.IAC33_ANDROID_KEY_PASSWORD }}
          BRIDGE_KEY_B64: ${{ secrets.BRIDGE_ECDSA_PRIVATE_KEY_B64 }}
        run: |
          set -eu
          test -n "$KEYSTORE_B64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" >/dev/null
          test -n "$BRIDGE_KEY_B64"
          printf '%s' "$BRIDGE_KEY_B64" | base64 --decode > "$RUNNER_TEMP/bridge-key-build.raw"
          echo "Bridge key container: $(file -b "$RUNNER_TEMP/bridge-key-build.raw")"
          if grep -q '^-----BEGIN ' "$RUNNER_TEMP/bridge-key-build.raw"; then
            head -n 1 "$RUNNER_TEMP/bridge-key-build.raw" | tr -d '\r'
          fi
          if grep -q -- '-----BEGIN OPENSSH PRIVATE KEY-----' "$RUNNER_TEMP/bridge-key-build.raw"; then
            ssh-keygen -p -m PEM -P "" -N "" -f "$RUNNER_TEMP/bridge-key-build.raw" >/dev/null 2>&1
          fi
          if openssl pkey -in "$RUNNER_TEMP/bridge-key-build.raw" -out "$RUNNER_TEMP/bridge-key-build.pem" 2>/dev/null; then
            :
          elif openssl pkey -inform DER -in "$RUNNER_TEMP/bridge-key-build.raw" -out "$RUNNER_TEMP/bridge-key-build.pem" 2>/dev/null; then
            :
          elif openssl ec -inform DER -in "$RUNNER_TEMP/bridge-key-build.raw" -out "$RUNNER_TEMP/bridge-key-build.pem" 2>/dev/null; then
            :
          elif openssl pkcs8 -inform DER -in "$RUNNER_TEMP/bridge-key-build.raw" -nocrypt -out "$RUNNER_TEMP/bridge-key-build.pem" 2>/dev/null; then
            :
          elif [ "$(file -b "$RUNNER_TEMP/bridge-key-build.raw")" = "Java KeyStore" ]; then
            BRIDGE_ALIAS="$(keytool -list -keystore "$RUNNER_TEMP/bridge-key-build.raw" -storepass "$KEYSTORE_PASSWORD" 2>/dev/null | awk -F, '/PrivateKeyEntry/ {gsub(/^ +| +$/, "", $1); print $1; exit}')"
            test -n "$BRIDGE_ALIAS"
            keytool -importkeystore -noprompt               -srckeystore "$RUNNER_TEMP/bridge-key-build.raw" -srcstoretype JKS               -srcstorepass "$KEYSTORE_PASSWORD" -srcalias "$BRIDGE_ALIAS" -srckeypass "$KEYSTORE_PASSWORD"               -destkeystore "$RUNNER_TEMP/bridge-key-build.p12" -deststoretype PKCS12               -deststorepass "$KEYSTORE_PASSWORD" -destkeypass "$KEYSTORE_PASSWORD" >/dev/null 2>&1
            openssl pkcs12 -in "$RUNNER_TEMP/bridge-key-build.p12" -nocerts -nodes               -passin pass:"$KEYSTORE_PASSWORD" -out "$RUNNER_TEMP/bridge-key-build.pem" >/dev/null 2>&1
          elif openssl pkcs12 -in "$RUNNER_TEMP/bridge-key-build.raw" -nocerts -nodes -passin pass: -out "$RUNNER_TEMP/bridge-key-build.pem" 2>/dev/null; then
            :
          else
            echo "Unable to normalize Bridge ECDSA public-key source" >&2
            exit 1
          fi
          IAC33_OTA_PUBLIC_KEY_B64="$(openssl pkey -in "$RUNNER_TEMP/bridge-key-build.pem" -pubout -outform DER | base64 -w0)"
          test -n "$IAC33_OTA_PUBLIC_KEY_B64"
          gradle assembleRelease --no-daemon --stacktrace --console=plain             -PIAC33_OTA_PUBLIC_KEY_B64="$IAC33_OTA_PUBLIC_KEY_B64"             -Pandroid.injected.signing.store.file="$KEYSTORE_PATH"             -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD"             -Pandroid.injected.signing.key.alias="$KEY_ALIAS"             -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          test -s app/build/outputs/apk/release/app-release.apk

      - name: Sign OTA artifact
        env:
          BRIDGE_KEY_B64: ${{ secrets.BRIDGE_ECDSA_PRIVATE_KEY_B64 }}
        run: |
          set -eu
          test -n "$BRIDGE_KEY_B64"
          printf '%s' "$BRIDGE_KEY_B64" > "$RUNNER_TEMP/bridge-key.secret"
          python3 - "$RUNNER_TEMP/bridge-key.secret" "$RUNNER_TEMP/bridge-key.pem" <<'PY'
          import base64, pathlib, sys
          src, dst = map(pathlib.Path, sys.argv[1:3])
          value = src.read_text().strip()
          raw = value.encode()
          if b"-----BEGIN " in raw:
              key = raw
          else:
              key = base64.b64decode(b"".join(raw.split()), validate=True)
              if b"-----BEGIN " not in key and len(key) != 32:
                  try:
                      key = base64.b64decode(b"".join(key.split()), validate=True)
                  except Exception:
                      pass
          pathlib.Path(str(dst) + ".raw").write_bytes(key)
          print(len(key))
          PY
          if grep -q -- '-----BEGIN OPENSSH PRIVATE KEY-----' "$RUNNER_TEMP/bridge-key.pem.raw"; then
            cp "$RUNNER_TEMP/bridge-key.pem.raw" "$RUNNER_TEMP/bridge-key.ssh"
            ssh-keygen -p -m PEM -P "" -N "" -f "$RUNNER_TEMP/bridge-key.ssh" >/dev/null 2>&1
            cp "$RUNNER_TEMP/bridge-key.ssh" "$RUNNER_TEMP/bridge-key.pem"
          elif grep -q -- '-----BEGIN .*PRIVATE KEY-----' "$RUNNER_TEMP/bridge-key.pem.raw"; then
            cp "$RUNNER_TEMP/bridge-key.pem.raw" "$RUNNER_TEMP/bridge-key.pem"
          elif [ "$(wc -c < "$RUNNER_TEMP/bridge-key.pem.raw")" -eq 32 ]; then
            python3 - "$RUNNER_TEMP/bridge-key.pem.raw" "$RUNNER_TEMP/bridge-key.der" <<'PY'
          import pathlib, sys
          s = pathlib.Path(sys.argv[1]).read_bytes()
          # PKCS#8 PrivateKeyInfo wrapping an SEC1 P-256 private key.
          def L(n):
              if n < 128: return bytes([n])
              b = n.to_bytes((n.bit_length()+7)//8, "big"); return bytes([0x80|len(b)])+b
          def T(tag, body): return bytes([tag])+L(len(body))+body
          oid_ec  = bytes.fromhex("06072A8648CE3D0201")
          oid_p256 = bytes.fromhex("06082A8648CE3D030107")
          sec1 = T(0x30, T(0x02,b"\x01") + T(0x04,s) + T(0xA0,oid_p256))
          pkcs8 = T(0x30, T(0x02,b"\x00") + T(0x30,oid_ec+oid_p256) + T(0x04,sec1))
          pathlib.Path(sys.argv[2]).write_bytes(pkcs8)
          PY
            openssl pkey -inform DER -in "$RUNNER_TEMP/bridge-key.der" -out "$RUNNER_TEMP/bridge-key.pem"
          else
            if openssl pkey -in "$RUNNER_TEMP/bridge-key.pem.raw" -out "$RUNNER_TEMP/bridge-key.pem" 2>/dev/null; then
              :
            elif openssl pkey -inform DER -in "$RUNNER_TEMP/bridge-key.pem.raw" -out "$RUNNER_TEMP/bridge-key.pem" 2>/dev/null; then
              :
            elif openssl ec -inform DER -in "$RUNNER_TEMP/bridge-key.pem.raw" -out "$RUNNER_TEMP/bridge-key.pem" 2>/dev/null; then
              :
            elif openssl pkcs8 -inform DER -in "$RUNNER_TEMP/bridge-key.pem.raw" -nocrypt -out "$RUNNER_TEMP/bridge-key.pem" 2>/dev/null; then
              :
            elif openssl pkcs12 -in "$RUNNER_TEMP/bridge-key.pem.raw" -nocerts -nodes -passin pass: -out "$RUNNER_TEMP/bridge-key.pem" 2>/dev/null; then
              :
            else
              echo "Invalid Bridge ECDSA private key format" >&2
              exit 1
            fi
          fi
          openssl pkey -in "$RUNNER_TEMP/bridge-key.pem" -text -noout >/dev/null
          openssl dgst -sha256 -sign "$RUNNER_TEMP/bridge-key.pem" app/build/outputs/apk/release/app-release.apk > "$RUNNER_TEMP/ota-signature.bin"
          base64 -w0 "$RUNNER_TEMP/ota-signature.bin" > "$RUNNER_TEMP/ota-signature.b64"
          sha256sum app/build/outputs/apk/release/app-release.apk | cut -d' ' -f1 > "$RUNNER_TEMP/ota-sha256"
          stat -c '%s' app/build/outputs/apk/release/app-release.apk > "$RUNNER_TEMP/ota-size"

      - name: Create GitHub release and manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          VERSION_NAME="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)"
          test -n "$VERSION_NAME"
          TAG="ota-$VERSION_NAME-$GITHUB_RUN_NUMBER"
          RELEASE_ID="$TAG"
          ARTIFACT_NAME="iac33-$TAG.apk"
          cp app/build/outputs/apk/release/app-release.apk "$ARTIFACT_NAME"
          ARTIFACT_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$ARTIFACT_NAME"
          CREATED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          SHA256="$(cat "$RUNNER_TEMP/ota-sha256")"
          SIZE="$(cat "$RUNNER_TEMP/ota-size")"
          SIGNATURE="$(cat "$RUNNER_TEMP/ota-signature.b64")"
          jq -n             --arg releaseId "$RELEASE_ID"             --arg appVersion "$VERSION_NAME"             --arg createdAt "$CREATED_AT"             --arg artifactRef "$ARTIFACT_URL"             --arg sha "$SHA256"             --argjson size "$SIZE"             --arg signature "$SIGNATURE"             '{
              schemaVersion:1,
              releaseId:$releaseId,
              appVersion:$appVersion,
              createdAt:$createdAt,
              minimumSupportedVersion:"0.1.0",
              artifactRef:$artifactRef,
              artifactSha256:$sha,
              artifactSize:$size,
              algorithm:"SHA256withECDSA",
              signatureBase64:$signature,
              keyId:"iac33-bridge-ecdsa-v1",
              rollbackRef:$artifactRef
            }' > manifest.json
          gh release create "$TAG" "$ARTIFACT_NAME" manifest.json             --title "IAC33 OTA $VERSION_NAME"             --notes "Signed OTA release for IAC33 commit $GITHUB_SHA."

      - name: Queue OTA command to IAC33 backend
        env:
          CONTROL_TOKEN: ${{ secrets.CONTROL_TOKEN }}
          BACKEND_URL: https://iac33-backend.onrender.com
        run: |
          set -eu
          test -n "$CONTROL_TOKEN"
          VERSION_NAME="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)"
          TAG="ota-$VERSION_NAME-$GITHUB_RUN_NUMBER"
          ARTIFACT_NAME="iac33-$TAG.apk"
          ARTIFACT_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$ARTIFACT_NAME"
          CREATED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          EXPIRES_AT="$(date -u -d '+24 hours' +%Y-%m-%dT%H:%M:%SZ)"
          SHA256="$(cat "$RUNNER_TEMP/ota-sha256")"
          SIZE="$(cat "$RUNNER_TEMP/ota-size")"
          SIGNATURE="$(cat "$RUNNER_TEMP/ota-signature.b64")"
          COMMAND_ID="ota-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          IDEMPOTENCY="ota-$GITHUB_SHA"
          IDEMPOTENCY="${IDEMPOTENCY:0:40}"
          jq -n             --arg id "$COMMAND_ID"             --arg type "OTA_INSTALL"             --arg idempotencyKey "$IDEMPOTENCY"             --arg expiresAt "$EXPIRES_AT"             --arg releaseId "$TAG"             --arg appVersion "$VERSION_NAME"             --arg createdAt "$CREATED_AT"             --arg artifactRef "$ARTIFACT_URL"             --arg sha "$SHA256"             --argjson size "$SIZE"             --arg signature "$SIGNATURE"             '{
              id:$id,
              type:$type,
              idempotencyKey:$idempotencyKey,
              expiresAt:$expiresAt,
              payload:{
                manifest:{
                  schemaVersion:1,
                  releaseId:$releaseId,
                  appVersion:$appVersion,
                  createdAt:$createdAt,
                  minimumSupportedVersion:"0.1.0",
                  artifactRef:$artifactRef,
                  artifactSha256:$sha,
                  artifactSize:$size,
                  algorithm:"SHA256withECDSA",
                  signatureBase64:$signature,
                  keyId:"iac33-bridge-ecdsa-v1",
                  rollbackRef:$artifactRef
                }
              }
            }' > ota-command.json
          curl --fail-with-body --silent --show-error             -H "Authorization: Bearer $CONTROL_TOKEN"             -H "Content-Type: application/json"             --data-binary @ota-command.json             "$BACKEND_URL/v1/gpt/commands"